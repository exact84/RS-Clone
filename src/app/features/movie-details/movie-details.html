@if (isError()) {
  <div class="error">Error - {{ isError() }}</div>
} @else if (isLoading()) {
  <div class="loader-wrapper">
    <img [src]="spinnerPath" alt="Loading..." class="loader" />
  </div>
} @else {
  <app-movie-details-card [data]="cardDetails()" />
}

<app-horizontal-slider title="Top Billed Cast">
  @for (person of cast(); track person.id) {
    <app-person-card [data]="person" [variant]="'default'" [size]="'sm'" />
  }
</app-horizontal-slider>
