<header class="header">
  <div class="logo">
    <a routerLink="/movie">
      <img src="logo.svg" alt="move-app-logo" />
    </a>
  </div>

  <div *appScreenLargeDirective class="nav">
    <app-menu />
  </div>

  <div *appScreenSmallDirective>
    <button (click)="menuService.toggleMenu()">
      <img src="./menu.png" alt="menu burger" />
    </button>
    @if (menuService.showVerticalMenu) {
      <app-menu class="vertical-menu" />
    }
  </div>

  <div class="auth">
    <a routerLink="/login">Login</a>
    <a routerLink="/signup">Register</a>
  </div>
</header>
