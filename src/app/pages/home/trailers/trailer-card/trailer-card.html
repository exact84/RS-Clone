<div class="movie-card">
  <div class="movie-card__poster">
    <img [src]="url + posterUrl" [alt]="title" />

    <button class="play-btn" (click)="emitTrailerClick()">
      <img src="icon-play.png" alt="play" class="play-btn__icon" />
    </button>
  </div>

  <div class="movie-card__info">
    <h3>{{ title }}</h3>
    <p>{{ description }}</p>
  </div>
</div>
