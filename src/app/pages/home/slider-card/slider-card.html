<div
  class="movie-card"
  (click)="goToDetails()"
  (keydown.enter)="goToDetails()"
  tabindex="0"
  role="button"
>
  <div class="movie-card__poster">
    <img [src]="posterUrl" [alt]="title" />
    <div class="vote-average__wrapper">
      <app-rating-badge [voteAverage]="vote_average" />
    </div>
  </div>
  <div class="movie-card__info">
    <h3 class="movie-card__title">{{ title }}</h3>
    <h3 class="movie-card__release">{{ date | date: 'MMM dd, yyyy' }}</h3>
  </div>
  <div class="vote-average__wrapper"></div>
</div>
