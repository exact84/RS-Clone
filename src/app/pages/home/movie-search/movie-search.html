<section class="hero">
  <div class="hero-content">
    <h1>Welcome.</h1>
    <p>Millions of movies to discover. Explore now.</p>
    <form class="search-form" (submit)="$event.preventDefault()">
      <input #searchInput type="text" placeholder="Search for a movie......" />
      <button (click)="submitSearch(searchInput.value)">Search</button>
    </form>
  </div>
</section>
