<div class="container">
  <div class="movie-search-filter">
    <form (ngSubmit)="page.set(1); fetchMovies()">
      <label for="search"
        >Search:
        <input
          id="search"
          name="search"
          type="text"
          [formControl]="searchControl"
          placeholder="Search..."
          autocomplete="on"
      /></label>

      <div class="genres-list">
        <span>Genres:</span>
        @for (g of genres(); track g.id) {
          <label>
            <input
              name="genre"
              type="checkbox"
              [checked]="selectedGenres().includes(g.id)"
              (change)="toggleGenre(g.id, $event.target.checked)"
            />
            {{ g.name }}
          </label>
        }
      </div>

      <label for="year"
        >Year:
        <input
          id="year"
          name="year"
          type="number"
          placeholder="Year"
          autocomplete="on"
          [ngModel]="selectedYear()"
          (ngModelChange)="selectedYear.set($event)"
      /></label>

      <label for="language"
        >Language:
        <select
          id="language"
          name="language"
          autocomplete="on"
          [ngModel]="selectedLanguage()"
          (ngModelChange)="selectedLanguage.set($event)"
        >
          <option [ngValue]="null">All</option>
          @for (lang of languages(); track lang.iso_639_1) {
            <option [ngValue]="lang.iso_639_1">
              {{ lang.english_name }}
            </option>
          }
        </select>
      </label>

      <label for="country">
        Country:
        <select
          id="country"
          name="country"
          autocomplete="on"
          [ngModel]="selectedCountry()"
          (ngModelChange)="selectedCountry.set($event)"
        >
          <option [ngValue]="null">All</option>
          @for (country of countries(); track country.iso_3166_1) {
            <option [value]="country.iso_3166_1">
              {{ country.english_name }}
            </option>
          }
        </select>
      </label>

      <div>Rating</div>
      <div class="rating">
        <label for="ratingMin">
          Min:
          <input
            id="ratingMin"
            name="ratingMin"
            type="number"
            min="0"
            max="10"
            step="0.1"
            placeholder="0–10"
            [ngModel]="selectedRatingMin()"
            (ngModelChange)="selectedRatingMin.set($event)"
          />
        </label>

        <label for="ratingMax">
          Max:
          <input
            id="ratingMax"
            name="ratingMax"
            type="number"
            step="0.1"
            min="0"
            max="10"
            placeholder="0–10"
            [ngModel]="selectedRatingMax()"
            (ngModelChange)="selectedRatingMax.set($event)"
          />
        </label>
      </div>

      <button type="submit" [disabled]="!canSearch()">Search</button>
    </form>
  </div>

  <div class="movie-list">
    @for (movie of movies(); track $index) {
      @if (loading()) {
        <!-- <app-spinner></app-spinner> -->
      } @else if (error()) {
        <div class="error">{{ error() }}</div>
      } @else {
        <app-slider-card [data]="movie"></app-slider-card>
      }
    }
  </div>
</div>

@if (totalPages() > 1) {
  <div class="pagination">
    <button [disabled]="page() === 1" (click)="page.set(page() - 1); fetchMovies()">← Back</button>
    <span>Page {{ page() }} из {{ totalPages() }}</span>
    <button [disabled]="page() === totalPages()" (click)="page.set(page() + 1); fetchMovies()">
      Forward →
    </button>
  </div>
}
